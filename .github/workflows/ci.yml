name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy .env to .env.local
        run: php -r "file_exists('.env.local') || copy('.env', '.env.local');"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        uses: docker/bake-action@v6
        with:
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{ github.ref }}
            *.cache-from=type=gha,scope=refs/heads/master
            *.cache-to=type=gha,scope=${{ github.ref }},mode=max

      - name: Start services
        run: docker compose up --wait --no-build

      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost:8000

      - name: Create test database
        run: docker compose exec -T php php bin/console -e test doctrine:database:create --if-not-exists

      - name: Run migrations
        run: docker compose exec -T php php bin/console -e test doctrine:migrations:migrate --no-interaction

      - name: Load fixtures
        run: docker compose exec -T php php bin/console -e test doctrine:fixtures:load --no-interaction

      - name: Run PHPUnit
        run: docker compose exec -T php php bin/phpunit

      - name: Doctrine Schema Validator
        run: docker compose exec -T php php bin/console -e test doctrine:schema:validate --skip-sync

      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
